[project]
name = "codebase-insights"
version = "0.0.0"
description = "Understand a brownfield codebase quickly: deterministic stats (L1) plus LLM-detected conventions and patterns (L2)."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codebase_insights"]
